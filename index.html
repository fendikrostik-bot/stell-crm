<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stell CRM</title></head>
<body>
<div id="boot" style="font-family:Arial,sans-serif;padding:30px">Завантаження Stell CRM…</div>
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/fendikrostik-bot/stell-crm/84807a2928668928605f96b0c40925306b6a4960/index.html';
    let html=await (await fetch(source,{cache:'no-store'})).text();

    // Correct the profile cache field so refresh restores the employee/admin name too.
    html=html.replace(
      "localStorage.setItem('stellProfileCache',JSON.stringify({id:currentUserId,buyer_name:currentUser,role:currentRole,permissions:currentPermissions}))",
      "localStorage.setItem('stellProfileCache',JSON.stringify({id:currentUserId,user:currentUser,role:currentRole,permissions:currentPermissions}))"
    );

    // The old page referenced buyerDay/buyerMonth fields that no longer exist.
    // That JavaScript exception happened before restoreSession(), so every F5 looked like logout.
    html=html.replace(
      "document.getElementById('buyerDay').value=todayISO;document.getElementById('buyerMonth').value=todayISO.slice(0,7);",
      "const _buyerDay=document.getElementById('buyerDay'),_buyerMonth=document.getElementById('buyerMonth');if(_buyerDay)_buyerDay.value=todayISO;if(_buyerMonth)_buyerMonth.value=todayISO.slice(0,7);"
    );

    // Make startup resilient: session restoration always gets a chance to run.
    html=html.replace(
      "document.getElementById('date').value=todayISO;document.getElementById('capMonth').value=todayISO.slice(0,7);",
      "const _date=document.getElementById('date'),_capMonth=document.getElementById('capMonth');if(_date)_date.value=todayISO;if(_capMonth)_capMonth.value=todayISO.slice(0,7);"
    );
    html=html.replace(
      "document.getElementById('statsFrom').value=todayISO;document.getElementById('statsTo').value=todayISO;document.getElementById('roiDate').value=todayISO.slice(0,7);document.getElementById('roiDateTo').value=todayISO;restoreSession();",
      "const _statsFrom=document.getElementById('statsFrom'),_statsTo=document.getElementById('statsTo'),_roiDate=document.getElementById('roiDate'),_roiDateTo=document.getElementById('roiDateTo');if(_statsFrom)_statsFrom.value=todayISO;if(_statsTo)_statsTo.value=todayISO;if(_roiDate)_roiDate.value=todayISO.slice(0,7);if(_roiDateTo)_roiDateTo.value=todayISO;restoreSession();"
    );

    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<b>Не вдалося завантажити CRM.</b><br>Онови сторінку через кілька секунд.';
    console.error(e);
  }
})();
</script>
</body>
</html>
